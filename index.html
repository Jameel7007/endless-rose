<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee3d1">
  <title>Endless Rose · greybox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23b8862f'%3E%3Crect x='8' y='8' width='16' height='16'/%3E%3Crect x='8' y='8' width='16' height='16' transform='rotate(45 16 16)'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="hall" aria-label="An endless prayer hall in plain plaster: rows of columns and horseshoe arches, with a nave leading to a glowing mihrab"></canvas>
  <div id="fade" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="name">Endless Rose</span>
      <span class="tag" id="status">Greybox · T-plan</span>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Mihrab">
        <span class="seg-label" aria-hidden="true">Mihrab</span>
        <button type="button" data-mode="arrive" aria-pressed="true" title="Each round of 33 walks you to the mihrab">Arrive</button>
        <button type="button" data-mode="ahead" aria-pressed="false" title="The qibla wall stays on the horizon">Ahead</button>
      </div>
      <button type="button" id="light" class="pill" aria-expanded="false" aria-controls="light-panel">Light</button>
      <button type="button" id="reset" class="pill">Reset</button>
    </div>
  </header>

  <section id="light-panel" class="panel" aria-label="Light and prayer times" hidden>
    <p class="panel-title">The day</p>
    <p id="place" class="place"></p>
    <ol id="times" class="times"></ol>
    <label class="preview">
      <span>Preview the day <output id="preview-out"></output></span>
      <input id="preview" type="range" min="0" max="1439" step="1">
    </label>
    <div class="row">
      <button type="button" id="now" class="pill small">Now</button>
      <button type="button" id="locate" class="pill small">Use my location</button>
    </div>
    <p id="place-note" class="note" role="status"></p>
    <div class="row selects">
      <label><span>Method</span><select id="method"></select></label>
      <label><span>Asr</span><select id="asr"><option value="standard">Standard</option><option value="hanafi">Hanafi</option></select></label>
    </div>
  </section>

  <section class="dhikr">
    <p id="phrase" class="phrase">SubhanAllah</p>
    <p id="gloss" class="gloss">Glory be to God</p>
    <p class="count" aria-live="polite"><span id="n">0</span> <span id="of" class="of">/ 33</span></p>
    <p id="hint" class="hint"></p>
  </section>

  <p id="nogl" class="nogl" hidden>This hall needs WebGL, which this browser has turned off.</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
